[build]
# P0-fixed: minimal flags — profile controls lto/opt/strip. Keep native for local/Termux.
# GH will use ci.yml RUSTFLAGS (conservative x86-64-v3). This file now only ensures incremental false.
incremental = false
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-linux-android]
linker = "clang"
# Termux inherits build rustflags (native)

[target.x86_64-unknown-linux-gnu]
# P0-fixed: conservative Haswell-level (x86-64-v3) — baseline 20.16M proven.
# Let ci.yml override with RUSTFLAGS if needed; keep here as fallback safe.
rustflags = ["-C", "target-cpu=x86-64-v3"]
