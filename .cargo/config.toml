[build]
# GH runner: znver3 == EPYC 7763 (ubuntu-latest). Local/Termux: native.
# Profile controls lto/codegen/opt-level/panic/strip (avoid RUSTFLAGS collision).
incremental = false
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-linux-android]
linker = "clang"
# Inherit build rustflags (native) + keep linker

[target.x86_64-unknown-linux-gnu]
# GH x86_64 explicit znver3 superset (AVX2+BMI1/BMI2 => movbe/fma auto)
rustflags = ["-C", "target-cpu=znver3", "-C", "target-feature=+avx2,+bmi1,+bmi2,+fma,+movbe"]
