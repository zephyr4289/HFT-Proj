            "kbench_1t": "$KBENCH_1T",
            "bit_parity": "$BIT_PARITY",
            "allocs": "$ALLOCS",
            "timestamp": "$(date -u)"
          }
          EOF

      - name: Upload Shard Output
        if: steps.gate.outputs.matched == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-result-${{ matrix.shard }}
          path: /tmp/shard_output/
          retention-days: 1

  check-wave-2:
    name: "Check Wave 2 Status"
    needs: [check-wave-1, wave-2]
    if: always() && needs.check-wave-1.outputs.acquired != 'true'
    runs-on: ubuntu-latest
    outputs:
      acquired: ${{ steps.check.outputs.acquired }}
    steps:
      - name: Query Target Artifacts
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
