          KBENCH_1T=$(grep -E "KBENCH mode=fold512_r.*threads=1 " /tmp/kbench.txt 2>/dev/null | awk '{print $4, $5}' || echo "N/A")
          BIT_PARITY=$(grep -oE "HYDRA_BITPARITY.*-> [A-Z-]+" /tmp/bench_hydra.txt 2>/dev/null | cut -d'>' -f2 | xargs || echo "N/A")
