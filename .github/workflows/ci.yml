            "matched": true,
            "cpu_name": "$CPU_NAME",
            "sustained_rate": "$SUSTAINED_RATE",
            "kbench_1t": "$KBENCH_1T",
            "bit_parity": "$BIT_PARITY",
            "allocs": "$ALLOCS",
            "timestamp": "$(date -u)"
          }
          EOF

      - name: Upload Shard Output
        if: steps.gate.outputs.matched == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-result-${{ matrix.shard }}
          path: /tmp/shard_output/
          retention-days: 1

  # ==========================================
  # FINAL AGGREGATOR: Scoreboard & Unified Zip
  # ==========================================
  aggregate-and-report:
    name: "Consolidate Draws & Publish Scoreboard"
    needs: [wave-1, check-wave-1, wave-2, check-wave-2, wave-3, check-wave-3, wave-4, check-wave-4, wave-5]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Shard Results
        uses: actions/download-artifact@v4
        with:
          path: /tmp/raw_shards
          pattern: shard-result-*
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate Draws & Generate Step Summary
        id: aggregate
        run: |
          mkdir -p consolidated-logs
          
          echo "## 🚀 Silicon Target Acquisition & Benchmark Scoreboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          TOTAL_HITS=0
          
          if [ -d "/tmp/raw_shards" ] && [ "$(ls -A /tmp/raw_shards 2>/dev/null)" ]; then
            echo "| Draw | Shard | Host Silicon | Sustained Full-Verify (msg/s) | kbench fold512_r 1t | Bit Parity | Allocations |" >> $GITHUB_STEP_SUMMARY
            echo "| :---: | :---: | :--- | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
            
            DRAW_NUM=1
            for shard_dir in /tmp/raw_shards/shard-result-*; do
              if [ -d "$shard_dir" ]; then
                TOTAL_HITS=$((TOTAL_HITS + 1))
                META_FILE="$shard_dir/shard_meta.json"
                
                if [ -f "$META_FILE" ]; then
                  SHARD=$(jq -r '.shard' "$META_FILE")
                  CPU=$(jq -r '.cpu_name' "$META_FILE")
                  RATE=$(jq -r '.sustained_rate' "$META_FILE")
                  KBENCH=$(jq -r '.kbench_1t' "$META_FILE")
                  PARITY=$(jq -r '.bit_parity' "$META_FILE")
                  ALLOC=$(jq -r '.allocs' "$META_FILE")
                  
                  echo "| **#$DRAW_NUM** | Shard $SHARD | \`$CPU\` | **$RATE** | $KBENCH | \`$PARITY\` | \`$ALLOC\` |" >> $GITHUB_STEP_SUMMARY
                  DRAW_NUM=$((DRAW_NUM + 1))
                fi
                cp "$shard_dir"/* consolidated-logs/ 2>/dev/null || true
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Target hits in this round:** $TOTAL_HITS shards landed on certified Xeon silicon." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **No shards acquired target silicon (8573C / 8370C) across all executed waves.**" >> $GITHUB_STEP_SUMMARY
            echo "All shards fast-discarded in < 2s." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "TOTAL_HITS=$TOTAL_HITS" >> "$GITHUB_OUTPUT"

      - name: Package Consolidated Artifact
        if: steps.aggregate.outputs.TOTAL_HITS != '0'
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-silicon-draws
          path: consolidated-logs/
          retention-days: 14

      - name: Update build-log Branch with Consolidated Logs
        if: steps.aggregate.outputs.TOTAL_HITS != '0' && always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin || true
          git checkout -B build-log
          mkdir -p ci-logs
          cp consolidated-logs/* ci-logs/ 2>/dev/null || true
          echo "Run triggered by commit: ${{ github.sha }}" > ci-logs/run-metadata.txt
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ci-logs/run-metadata.txt
          echo "Timestamp: $(date -u)" >> ci-logs/run-metadata.txt
          git add -f ci-logs/
          git commit -m "ci: auto-update consolidated build logs for ${{ github.sha }} [skip ci]" || true
          git push origin build-log --force
