name: ci
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CI Suite with Full Log Capture
        id: ci_run
        run: |
          set -o pipefail
          ./scripts/ci.sh 2>&1 | tee /tmp/ci_full_output.log

      - name: Auto-push Execution Logs to build-log Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin || true
          git checkout -B build-log
          mkdir -p ci-logs
          cp /tmp/ci_full_output.log ci-logs/ 2>/dev/null || true
          cp /tmp/*.txt ci-logs/ 2>/dev/null || true
          echo "Run triggered by commit: ${{ github.sha }}" > ci-logs/run-metadata.txt
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ci-logs/run-metadata.txt
          echo "Timestamp: $(date -u)" >> ci-logs/run-metadata.txt
          git add ci-logs/
          git commit -m "ci: auto-update build logs for ${{ github.sha }} [skip ci]" || true
          git push origin build-log --force
