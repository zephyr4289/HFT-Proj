            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "🎯 TARGET SILICON ACQUIRED ($CPU_NAME). Proceeding to full benchmark."
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "❌ Non-target silicon ($CPU_NAME). Fast-discarding in < 1s."
          fi

      - name: Cache Cargo Registry & Build
        if: steps.gate.outputs.matched == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v3-v0.1"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v0.1' }}

      - name: Run Full CI & Benchmark Suite
        if: steps.gate.outputs.matched == 'true'
        id: ci_run
        run: |
          set -o pipefail
          echo "RUSTFLAGS=$RUSTFLAGS"
          echo "CARGO_PROFILE_RELEASE_LTO=$CARGO_PROFILE_RELEASE_LTO"
          rustc --print cfg | grep target_cpu || true
          rustc -Vv
          ./scripts/ci.sh 2>&1 | tee /tmp/ci_full_output.log

      - name: Extract Shard Telemetry & Metrics
        if: steps.gate.outputs.matched == 'true' && always()
        run: |
          mkdir -p /tmp/shard_output
          cp /tmp/ci_full_output.log /tmp/shard_output/draw-shard${{ matrix.shard }}.log 2>/dev/null || true
          cp /tmp/bench_hydra.txt /tmp/shard_output/bench_hydra.txt 2>/dev/null || true
          cp /tmp/kbench.txt /tmp/shard_output/kbench.txt 2>/dev/null || true
          cp /tmp/bench_results.json /tmp/shard_output/bench_results.json 2>/dev/null || true
          
