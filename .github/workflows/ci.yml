name: ci
on: [push]

concurrency:
  group: ci-singleton
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 3
      # P0-fixed: conservative x86-64-v3 (Haswell) baseline 20.16M proven.
      # P1 will replace hash (CRC32C hw), not CPU flags. Keep lto fat via profile.
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-v3-v0.1"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v0.1' }}

      - name: Run CI Suite with Full Log Capture
        id: ci_run
        run: |
          set -o pipefail
          echo "RUSTFLAGS=$RUSTFLAGS"
          echo "CARGO_PROFILE_RELEASE_LTO=$CARGO_PROFILE_RELEASE_LTO"
          rustc --print cfg | grep target_cpu || true
          rustc -Vv
          ./scripts/ci.sh 2>&1 | tee /tmp/ci_full_output.log

      - name: Auto-push Execution Logs to build-log Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin || true
          git checkout -B build-log
          mkdir -p ci-logs
          cp /tmp/ci_full_output.log ci-logs/ 2>/dev/null || true
          cp /tmp/*.txt ci-logs/ 2>/dev/null || true
          cp /tmp/*.json ci-logs/ 2>/dev/null || true
          cp /tmp/musl_build.log ci-logs/ 2>/dev/null || true
          echo "Run triggered by commit: ${{ github.sha }}" > ci-logs/run-metadata.txt
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ci-logs/run-metadata.txt
          echo "Timestamp: $(date -u)" >> ci-logs/run-metadata.txt
          git add -f ci-logs/
          git commit -m "ci: auto-update build logs for ${{ github.sha }} [skip ci]" || true
          git push origin build-log --force
