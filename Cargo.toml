[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
overflow-checks = false
incremental = false
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = false

[profile.test]
opt-level = 2
overflow-checks = false
incremental = false
